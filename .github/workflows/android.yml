name: APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A chave de assinatura vem só dos secrets; nunca fica no repositório.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Crie os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (ver README)"; exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/spectre.jks

      - name: Testes e APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk financas-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: financas-apk
          path: financas-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      # Publica em Releases: dá para baixar direto no celular, sem login.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Finanças 1.0.${{ github.run_number }}
          files: financas-*.apk
